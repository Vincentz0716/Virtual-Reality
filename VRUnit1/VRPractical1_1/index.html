<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VR Practical 1.1 - Simple Trucks</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Left truck -->
      <a-entity class="truck" position="-1.5 0 0">
        <!-- Main chassis -->
        <a-box position="0 0.62 0" width="1.8" height="0.35" depth="3.4" color="#2878b8"></a-box>
        <!-- Hood -->
        <a-box position="0 0.92 1.02" width="1.8" height="0.28" depth="1.3" color="#2878b8"></a-box>

        <!-- Cab body -->
        <a-box position="0 1.2 0.35" width="1.65" height="0.95" depth="1.25" color="#2878b8"></a-box>
        <!-- Front windshield -->
        <a-box position="0 1.24 1.0" width="1.35" height="0.58" depth="0.04" color="#9be7ff" opacity="0.85"></a-box>
        <!-- Left cab window -->
        <a-box position="-0.84 1.25 0.35" width="0.04" height="0.56" depth="0.8" color="#9be7ff" opacity="0.85"></a-box>
        <!-- Right cab window -->
        <a-box position="0.84 1.25 0.35" width="0.04" height="0.56" depth="0.8" color="#9be7ff" opacity="0.85"></a-box>

        <!-- Left bed side -->
        <a-box position="-0.72 0.92 -0.95" width="0.18" height="0.65" depth="1.5" color="#2878b8"></a-box>
        <!-- Right bed side -->
        <a-box position="0.72 0.92 -0.95" width="0.18" height="0.65" depth="1.5" color="#2878b8"></a-box>
        <!-- Rear tailgate -->
        <a-box position="0 0.92 -1.5" width="1.8" height="0.65" depth="0.2" color="#2878b8"></a-box>

        <!-- Left headlight -->
        <a-box position="-0.58 0.58 1.72" width="0.3" height="0.16" depth="0.05" color="#fff1a6"></a-box>
        <!-- Right headlight -->
        <a-box position="0.58 0.58 1.72" width="0.3" height="0.16" depth="0.05" color="#fff1a6"></a-box>

        <!-- Front left wheel -->
        <a-cylinder position="-0.92 0.38 1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
        <!-- Front right wheel -->
        <a-cylinder position="0.92 0.38 1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
        <!-- Rear left wheel -->
        <a-cylinder position="-0.92 0.38 -1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
        <!-- Rear right wheel -->
        <a-cylinder position="0.92 0.38 -1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
      </a-entity>

      <!-- Right truck -->
      <a-entity class="truck" position="1.5 0 0">
        <!-- Main chassis -->
        <a-box position="0 0.62 0" width="1.8" height="0.35" depth="3.4" color="#c0392b"></a-box>
        <!-- Hood -->
        <a-box position="0 0.92 1.02" width="1.8" height="0.28" depth="1.3" color="#c0392b"></a-box>

        <!-- Cab body -->
        <a-box position="0 1.2 0.35" width="1.65" height="0.95" depth="1.25" color="#c0392b"></a-box>
        <!-- Front windshield -->
        <a-box position="0 1.24 1.0" width="1.35" height="0.58" depth="0.04" color="#9be7ff" opacity="0.85"></a-box>
        <!-- Left cab window -->
        <a-box position="-0.84 1.25 0.35" width="0.04" height="0.56" depth="0.8" color="#9be7ff" opacity="0.85"></a-box>
        <!-- Right cab window -->
        <a-box position="0.84 1.25 0.35" width="0.04" height="0.56" depth="0.8" color="#9be7ff" opacity="0.85"></a-box>

        <!-- Left bed side -->
        <a-box position="-0.72 0.92 -0.95" width="0.18" height="0.65" depth="1.5" color="#c0392b"></a-box>
        <!-- Right bed side -->
        <a-box position="0.72 0.92 -0.95" width="0.18" height="0.65" depth="1.5" color="#c0392b"></a-box>
        <!-- Rear tailgate -->
        <a-box position="0 0.92 -1.5" width="1.8" height="0.65" depth="0.2" color="#c0392b"></a-box>

        <!-- Left headlight -->
        <a-box position="-0.58 0.58 1.72" width="0.3" height="0.16" depth="0.05" color="#fff1a6"></a-box>
        <!-- Right headlight -->
        <a-box position="0.58 0.58 1.72" width="0.3" height="0.16" depth="0.05" color="#fff1a6"></a-box>

        <!-- Front left wheel -->
        <a-cylinder position="-0.92 0.38 1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
        <!-- Front right wheel -->
        <a-cylinder position="0.92 0.38 1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
        <!-- Rear left wheel -->
        <a-cylinder position="-0.92 0.38 -1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
        <!-- Rear right wheel -->
        <a-cylinder position="0.92 0.38 -1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
      </a-entity>

      <!-- Ground plane -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#719a56"></a-plane>
      <!-- Sky background -->
      <a-sky color="#d8edff"></a-sky>
      <!-- Camera -->
      <a-camera position="0 3 8" rotation="-12 0 0"></a-camera>
    </a-scene>
  </body>
</html>
