<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juniper Lane | Winter Neighborhood</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #cfe5f2" fog="type: exponential; color: #cfe5f2; density: 0.012" renderer="colorManagement: true; physicallyCorrectLights: true">
      <a-assets>
        <img id="grass-texture" src="../VRLesson1_3Classwork/texture_grass.jpeg">
        <img id="winter-sky" src="../VRLesson1_3Classwork/sky2.jpeg">
        <img id="spider-texture" src="../VRLesson1_6Classwork/spiderskin3.jpg">
      </a-assets>

      <a-entity id="neighborhood-ground">
        <a-plane position="0 -0.06 -1" rotation="-90 0 0" width="48" height="52" src="#grass-texture" repeat="14 16"></a-plane>
        <a-plane position="0 -0.025 -1" rotation="-90 0 0" width="7.2" height="48" color="#303a42"></a-plane>
        <a-plane position="-4.25 0.005 -1" rotation="-90 0 0" width="1.2" height="48" color="#d8d4c9"></a-plane>
        <a-plane position="4.25 0.005 -1" rotation="-90 0 0" width="1.2" height="48" color="#d8d4c9"></a-plane>
        <a-entity id="center-line">
          <a-box position="0 0.015 17" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
          <a-box position="0 0.015 12" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
          <a-box position="0 0.015 7" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
          <a-box position="0 0.015 2" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
          <a-box position="0 0.015 -3" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
          <a-box position="0 0.015 -8" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
          <a-box position="0 0.015 -13" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
          <a-box position="0 0.015 -18" width="0.12" height="0.02" depth="2.2" color="#f4e8bf"></a-box>
        </a-entity>
      </a-entity>

      <a-entity id="front-yards">
        <a-plane position="-7 0.008 10" rotation="-90 0 0" width="5.2" height="7.2" src="#grass-texture" repeat="2 3"></a-plane>
        <a-plane position="7 0.008 10" rotation="-90 0 0" width="5.2" height="7.2" src="#grass-texture" repeat="2 3"></a-plane>
        <a-plane position="-7 0.008 1" rotation="-90 0 0" width="5.2" height="7.2" src="#grass-texture" repeat="2 3"></a-plane>
        <a-plane position="7 0.008 1" rotation="-90 0 0" width="5.2" height="7.2" src="#grass-texture" repeat="2 3"></a-plane>
        <a-plane position="-7 0.008 -8" rotation="-90 0 0" width="5.2" height="7.2" src="#grass-texture" repeat="2 3"></a-plane>
        <a-plane position="7 0.008 -8" rotation="-90 0 0" width="5.2" height="7.2" src="#grass-texture" repeat="2 3"></a-plane>
      </a-entity>

      <template id="house-template">
        <a-entity class="house">
          <a-box class="siding" position="0 1.55 0" width="5" height="3.1" depth="3.9"></a-box>
          <a-box class="siding" position="-1.5 0.7 1.97" width="2" height="1.4" depth="0.12"></a-box>
          <a-box class="siding" position="1.5 0.7 1.97" width="2" height="1.4" depth="0.12"></a-box>
          <a-box class="siding" position="0 2.7 1.97" width="1.05" height="0.8" depth="0.12"></a-box>
          <a-box class="trim" position="0 0.12 0" width="5.2" height="0.24" depth="4.08"></a-box>
          <a-box class="trim" position="0 1.08 2.06" width="1.2" height="2.16" depth="0.15"></a-box>
          <a-box class="door" position="0 1.08 2.15" width="0.96" height="1.94" depth="0.08"></a-box>
          <a-sphere position="0.32 1.02 2.22" radius="0.065" color="#e8bd6b"></a-sphere>
          <a-box class="trim" position="-1.52 2.12 2.08" width="1.16" height="1.1" depth="0.12"></a-box>
          <a-box class="glass" position="-1.52 2.12 2.16" width="0.88" height="0.82" depth="0.08" material="emissive: #f6c96b; emissiveIntensity: 0.35"></a-box>
          <a-box class="trim" position="1.52 2.12 2.08" width="1.16" height="1.1" depth="0.12"></a-box>
          <a-box class="glass" position="1.52 2.12 2.16" width="0.88" height="0.82" depth="0.08" material="emissive: #f6c96b; emissiveIntensity: 0.35"></a-box>
          <a-box position="-1.52 2.12 2.22" width="0.08" height="0.9" depth="0.03" color="#f7e5bf"></a-box>
          <a-box position="-1.52 2.12 2.22" width="0.94" height="0.08" depth="0.03" color="#f7e5bf"></a-box>
          <a-box position="1.52 2.12 2.22" width="0.08" height="0.9" depth="0.03" color="#f7e5bf"></a-box>
          <a-box position="1.52 2.12 2.22" width="0.94" height="0.08" depth="0.03" color="#f7e5bf"></a-box>
          <a-box class="glass" position="-2.53 2.05 0" width="0.08" height="0.8" depth="0.9"></a-box>
          <a-box class="glass" position="2.53 2.05 0" width="0.08" height="0.8" depth="0.9"></a-box>
          <a-triangle class="siding" vertex-a="-2.5 0 1.98" vertex-b="2.5 0 1.98" vertex-c="0 1.65 1.98"></a-triangle>
          <a-triangle class="siding" vertex-a="-2.5 0 -1.98" vertex-b="0 1.65 -1.98" vertex-c="2.5 0 -1.98"></a-triangle>
          <a-box class="roof" position="-1.3 3.62 0" width="3.42" height="0.24" depth="4.55" rotation="0 0 34"></a-box>
          <a-box class="roof" position="1.3 3.62 0" width="3.42" height="0.24" depth="4.55" rotation="0 0 -34"></a-box>
          <a-box class="roof" position="-1.3 3.75 0" width="3.25" height="0.06" depth="4.58" rotation="0 0 34"></a-box>
          <a-box class="roof" position="1.3 3.75 0" width="3.25" height="0.06" depth="4.58" rotation="0 0 -34"></a-box>
          <a-box class="roof" position="0 4.62 0" width="0.42" height="0.22" depth="4.72"></a-box>
          <a-box class="roof" position="0 4.12 -0.7" width="0.8" height="1.15" depth="0.8"></a-box>
          <a-box class="roof" position="0 4.72 -0.7" width="1.05" height="0.12" depth="1.05"></a-box>
          <a-box class="trim" position="0 2.92 2.12" width="2.45" height="0.12" depth="0.45"></a-box>
          <a-box class="trim" position="-1.08 1.45 2.17" width="0.12" height="2.8" depth="0.22"></a-box>
          <a-box class="trim" position="1.08 1.45 2.17" width="0.12" height="2.8" depth="0.22"></a-box>
          <a-box class="trim" position="-0.82 0.12 2.5" width="0.16" height="0.95" depth="0.16"></a-box>
          <a-box class="trim" position="0.82 0.12 2.5" width="0.16" height="0.95" depth="0.16"></a-box>
          <a-box class="trim" position="0 0.04 2.52" width="2" height="0.12" depth="0.9"></a-box>
          <a-box class="sign" position="0.83 1.9 2.32" width="0.48" height="0.34" depth="0.06"></a-box>
          <a-text class="house-number" value="12" position="0.83 1.82 2.37" align="center" width="1.2" color="#fff3d7"></a-text>
        </a-entity>
      </template>

      <template id="truck-template">
        <a-entity class="truck">
          <a-box class="truck-body" position="0 0.62 0" width="1.8" height="0.35" depth="3.4"></a-box>
          <a-box class="truck-body" position="0 0.92 1.02" width="1.8" height="0.28" depth="1.3"></a-box>
          <a-box class="truck-body" position="0 1.2 0.35" width="1.65" height="0.95" depth="1.25"></a-box>
          <a-box position="0 1.24 1" width="1.35" height="0.58" depth="0.04" color="#9be7ff" opacity="0.85"></a-box>
          <a-box position="-0.84 1.25 0.35" width="0.04" height="0.56" depth="0.8" color="#9be7ff" opacity="0.85"></a-box>
          <a-box position="0.84 1.25 0.35" width="0.04" height="0.56" depth="0.8" color="#9be7ff" opacity="0.85"></a-box>
          <a-box class="truck-body" position="-0.72 0.92 -0.95" width="0.18" height="0.65" depth="1.5"></a-box>
          <a-box class="truck-body" position="0.72 0.92 -0.95" width="0.18" height="0.65" depth="1.5"></a-box>
          <a-box class="truck-body" position="0 0.92 -1.5" width="1.8" height="0.65" depth="0.2"></a-box>
          <a-box position="-0.58 0.58 1.72" width="0.3" height="0.16" depth="0.05" color="#fff1a6" material="emissive: #fff1a6; emissiveIntensity: 0.8"></a-box>
          <a-box position="0.58 0.58 1.72" width="0.3" height="0.16" depth="0.05" color="#fff1a6" material="emissive: #fff1a6; emissiveIntensity: 0.8"></a-box>
          <a-cylinder position="-0.92 0.38 1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
          <a-cylinder position="0.92 0.38 1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
          <a-cylinder position="-0.92 0.38 -1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
          <a-cylinder position="0.92 0.38 -1.05" rotation="0 0 90" radius="0.38" height="0.2" color="#202124"></a-cylinder>
        </a-entity>
      </template>

      <template id="tree-template">
        <a-entity class="tree">
          <a-cylinder position="0 1 0" height="2" radius="0.28" color="#684331"></a-cylinder>
          <a-cone position="0 1.8 0" height="2.5" radius-bottom="1.25" radius-top="0.08" color="#245746"></a-cone>
          <a-cone position="0 2.9 0" height="2.2" radius-bottom="1.05" radius-top="0.05" color="#2d7056"></a-cone>
          <a-cone position="0 3.85 0" height="1.9" radius-bottom="0.82" radius-top="0.02" color="#398066"></a-cone>
          <a-sphere position="0.62 1.55 0.72" radius="0.14" color="#df7166"></a-sphere>
          <a-sphere position="-0.58 2.45 0.55" radius="0.14" color="#e8c16d"></a-sphere>
          <a-sphere position="0.18 3.15 0.83" radius="0.14" color="#df7166"></a-sphere>
        </a-entity>
      </template>

      <template id="spider-template">
        <a-entity class="spider" scale="0.24 0.24 0.24">
          <a-sphere src="#spider-texture" position="0 0.36 0" radius="0.58"></a-sphere>
          <a-sphere src="#spider-texture" position="0 0.33 0.72" radius="0.36"></a-sphere>
          <a-sphere position="-0.15 0.42 1.01" radius="0.09" color="#fff2d0"></a-sphere>
          <a-sphere position="0.15 0.42 1.01" radius="0.09" color="#fff2d0"></a-sphere>
          <a-sphere position="-0.15 0.42 1.08" radius="0.045" color="#26313a"></a-sphere>
          <a-sphere position="0.15 0.42 1.08" radius="0.045" color="#26313a"></a-sphere>
          <a-cylinder src="#spider-texture" position="-0.65 0.23 0.42" radius="0.09" height="1.35" rotation="0 0 52"></a-cylinder>
          <a-cylinder src="#spider-texture" position="-0.9 0.2 0.85" radius="0.08" height="1.45" rotation="0 0 -42"></a-cylinder>
          <a-cylinder src="#spider-texture" position="0.65 0.23 0.42" radius="0.09" height="1.35" rotation="0 0 -52"></a-cylinder>
          <a-cylinder src="#spider-texture" position="0.9 0.2 0.85" radius="0.08" height="1.45" rotation="0 0 42"></a-cylinder>
          <a-cylinder src="#spider-texture" position="-0.65 0.23 -0.25" radius="0.09" height="1.35" rotation="0 0 52"></a-cylinder>
          <a-cylinder src="#spider-texture" position="-0.9 0.2 -0.65" radius="0.08" height="1.45" rotation="0 0 -42"></a-cylinder>
          <a-cylinder src="#spider-texture" position="0.65 0.23 -0.25" radius="0.09" height="1.35" rotation="0 0 -52"></a-cylinder>
          <a-cylinder src="#spider-texture" position="0.9 0.2 -0.65" radius="0.08" height="1.45" rotation="0 0 42"></a-cylinder>
        </a-entity>
      </template>

      <a-entity id="houses"></a-entity>
      <a-entity id="trucks"></a-entity>
      <a-entity id="trees"></a-entity>
      <a-entity id="spiders"></a-entity>

      <a-entity id="street-lamps">
        <a-entity position="-4.25 0 14">
          <a-cylinder position="0 2.3 0" radius="0.07" height="4.6" color="#48535b"></a-cylinder>
          <a-box position="0 4.55 0" width="0.65" height="0.16" depth="0.42" color="#e6ca8a" material="emissive: #ffd985; emissiveIntensity: 0.8"></a-box>
        </a-entity>
        <a-entity position="4.25 0 5">
          <a-cylinder position="0 2.3 0" radius="0.07" height="4.6" color="#48535b"></a-cylinder>
          <a-box position="0 4.55 0" width="0.65" height="0.16" depth="0.42" color="#e6ca8a" material="emissive: #ffd985; emissiveIntensity: 0.8"></a-box>
        </a-entity>
        <a-entity position="-4.25 0 -5">
          <a-cylinder position="0 2.3 0" radius="0.07" height="4.6" color="#48535b"></a-cylinder>
          <a-box position="0 4.55 0" width="0.65" height="0.16" depth="0.42" color="#e6ca8a" material="emissive: #ffd985; emissiveIntensity: 0.8"></a-box>
        </a-entity>
        <a-entity position="4.25 0 -14">
          <a-cylinder position="0 2.3 0" radius="0.07" height="4.6" color="#48535b"></a-cylinder>
          <a-box position="0 4.55 0" width="0.65" height="0.16" depth="0.42" color="#e6ca8a" material="emissive: #ffd985; emissiveIntensity: 0.8"></a-box>
        </a-entity>
      </a-entity>

      <a-entity light="type: ambient; color: #d8e8f5; intensity: 1.35"></a-entity>
      <a-entity light="type: directional; color: #fff0d2; intensity: 2.1" position="-4 9 6"></a-entity>
      <a-sky src="#winter-sky" rotation="0 -20 0"></a-sky>
      <a-camera position="0 2 24" rotation="-5 0 0" wasd-controls="acceleration: 32"></a-camera>

      <script>
        const housePalettes = [
          { position: '-7 0 9', rotation: '0 90 0', siding: '#e5c99c', roof: '#7b403d', trim: '#f5e6ca', door: '#3f6557', glass: '#91c3ca', sign: '#9d5c46', number: '12' },
          { position: '7 0 9', rotation: '0 -90 0', siding: '#b8d2c7', roof: '#3f6661', trim: '#f1e8d4', door: '#ab684a', glass: '#87bfc4', sign: '#547b70', number: '14' },
          { position: '-7 0 0', rotation: '0 90 0', siding: '#d7b3a3', roof: '#5a3e51', trim: '#f4e6d6', door: '#4c647b', glass: '#93bdca', sign: '#755568', number: '16' },
          { position: '7 0 0', rotation: '0 -90 0', siding: '#e2d5a8', roof: '#536b53', trim: '#fbf0d4', door: '#994f42', glass: '#8ab8c1', sign: '#7b7048', number: '18' },
          { position: '-7 0 -9', rotation: '0 90 0', siding: '#c7d3df', roof: '#4b536c', trim: '#f2e8d8', door: '#a65f47', glass: '#92c0c8', sign: '#52677f', number: '20' },
          { position: '7 0 -9', rotation: '0 -90 0', siding: '#d5bda0', roof: '#75513d', trim: '#f8ead2', door: '#3f6557', glass: '#8dbcc4', sign: '#946d4c', number: '22' }
        ];

        const houseTemplate = document.querySelector('#house-template');
        const houseContainer = document.querySelector('#houses');
        housePalettes.forEach((palette) => {
          const house = houseTemplate.content.firstElementChild.cloneNode(true);
          house.id = `house-${palette.number}`;
          house.setAttribute('position', palette.position);
          house.setAttribute('rotation', palette.rotation);
          house.querySelectorAll('.siding').forEach((part) => part.setAttribute('color', palette.siding));
          house.querySelectorAll('.roof').forEach((part) => part.setAttribute('color', palette.roof));
          house.querySelectorAll('.trim').forEach((part) => part.setAttribute('color', palette.trim));
          house.querySelectorAll('.door').forEach((part) => part.setAttribute('color', palette.door));
          house.querySelectorAll('.glass').forEach((part) => part.setAttribute('color', palette.glass));
          house.querySelectorAll('.sign').forEach((part) => part.setAttribute('color', palette.sign));
          house.querySelector('.house-number').setAttribute('value', palette.number);
          houseContainer.appendChild(house);
        });

        const truckTemplate = document.querySelector('#truck-template');
        const truckContainer = document.querySelector('#trucks');
        [
          { position: '-1.7 0 14', color: '#2878b8' },
          { position: '1.7 0 4', color: '#c0392b' },
          { position: '-1.7 0 -7', color: '#d0a541' }
        ].forEach((truckData, index) => {
          const truck = truckTemplate.content.firstElementChild.cloneNode(true);
          truck.id = `truck-${index + 1}`;
          truck.setAttribute('position', truckData.position);
          truck.setAttribute('scale', '0.72 0.72 0.72');
          truck.querySelectorAll('.truck-body').forEach((part) => part.setAttribute('color', truckData.color));
          truckContainer.appendChild(truck);
        });

        const treeTemplate = document.querySelector('#tree-template');
        const treeContainer = document.querySelector('#trees');
        [
          ['-11 0 11', '0.78 0.78 0.78'], ['11 0 11', '0.72 0.72 0.72'],
          ['-11 0 2', '0.7 0.7 0.7'], ['11 0 2', '0.8 0.8 0.8'],
          ['-11 0 -7', '0.8 0.8 0.8'], ['11 0 -7', '0.72 0.72 0.72'],
          ['-14 0 -16', '0.95 0.95 0.95'], ['14 0 -16', '0.92 0.92 0.92']
        ].forEach((treeData, index) => {
          const tree = treeTemplate.content.firstElementChild.cloneNode(true);
          tree.id = `tree-${index + 1}`;
          tree.setAttribute('position', treeData[0]);
          tree.setAttribute('scale', treeData[1]);
          treeContainer.appendChild(tree);
        });

        const spiderTemplate = document.querySelector('#spider-template');
        const spiderContainer = document.querySelector('#spiders');
        [['-5 0.08 6', '0 30 0'], ['5 0.08 -3', '0 -25 0']].forEach((spiderData, index) => {
          const spider = spiderTemplate.content.firstElementChild.cloneNode(true);
          spider.id = `spider-${index + 1}`;
          spider.setAttribute('position', spiderData[0]);
          spider.setAttribute('rotation', spiderData[1]);
          spiderContainer.appendChild(spider);
        });
      </script>
    </a-scene>
  </body>
</html>
